<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Trip — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--border-glass);">
            <i class="fas fa-bars" style="color: var(--text-primary);"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i>Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/search"><i class="fas fa-search"></i>Plan Trip</a></li>
                <li class="nav-item"><a class="nav-link" href="/reviews"><i class="fas fa-star"></i>Reviews</a></li>
                <li class="nav-item" id="nav-dashboard" style="display:none;"><a class="nav-link" href="/dashboard"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li class="nav-item" id="nav-login"><a class="btn btn-outline-custom btn-sm-custom ms-2" href="/login">Sign In</a></li>
                <li class="nav-item" id="nav-user" style="display:none;">
                    <div class="d-flex align-items-center gap-2 ms-2">
                        <span class="nav-link" id="nav-username" style="color: var(--accent-cyan) !important;"></span>
                        <button class="btn btn-outline-custom btn-sm-custom" onclick="logout()">Logout</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="position: relative; z-index: 1;">
    <div class="page-header text-center">
        <h1 class="page-title"><i class="fas fa-paper-plane text-accent-cyan"></i> Plan Your Trip</h1>
        <p class="page-subtitle">Enter your travel details to find the best options</p>
    </div>

    <div class="search-box" style="max-width: 800px; margin: 0 auto;">
        <form id="searchForm" onsubmit="return handleSearch(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Source City</label>
                    <select id="sourceCity" class="form-select form-select-dark" required>
                        <option value="">Select departure city</option>
                        <option>Delhi</option>
                        <option>Mumbai</option>
                        <option>Bangalore</option>
                        <option>Jaipur</option>
                        <option>Goa</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Destination City</label>
                    <select id="destCity" class="form-select form-select-dark" required>
                        <option value="">Select destination city</option>
                        <option>Delhi</option>
                        <option>Mumbai</option>
                        <option>Bangalore</option>
                        <option>Jaipur</option>
                        <option>Goa</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Travel Date</label>
                    <input type="date" id="travelDate" class="form-control form-control-dark" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Number of Days</label>
                    <input type="number" id="numDays" class="form-control form-control-dark" min="1" max="30" value="3" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Travelers</label>
                    <input type="number" id="numTravelers" class="form-control form-control-dark" min="1" max="10" value="1" required>
                </div>
                <div class="col-12">
                    <label class="form-label-custom">Trip Name (Optional)</label>
                    <input type="text" id="tripName" class="form-control form-control-dark" placeholder="e.g., Goa Beach Vacation">
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary-custom w-100" style="padding: 0.85rem;">
                        <i class="fas fa-search"></i> Search Travel Options
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<footer class="footer">
    <div class="container text-center">
        <p class="footer-text">&copy; 2026 TravelPlanner. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>checkAuth();</script>
</body>
</html>
