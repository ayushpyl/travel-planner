<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--border-glass);">
            <i class="fas fa-bars" style="color: var(--text-primary);"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i>Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="fas fa-search"></i>Plan Trip</a></li>
                <li class="nav-item"><a class="nav-link" href="/reviews"><i class="fas fa-star"></i>Reviews</a></li>
                <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li class="nav-item">
                    <div class="d-flex align-items-center gap-2 ms-2">
                        <span class="nav-link" id="nav-username" style="color: var(--accent-cyan) !important;"></span>
                        <button class="btn btn-outline-custom btn-sm-custom" onclick="logout()">Logout</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="position: relative; z-index: 1;">
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="page-title"><i class="fas fa-th-large text-accent-blue"></i> My Dashboard</h1>
                <p class="page-subtitle">View and manage your saved trip plans</p>
            </div>
            <a href="/search" class="btn btn-primary-custom">
                <i class="fas fa-plus"></i> Plan New Trip
            </a>
        </div>
    </div>

    <div id="dashboard-loader" class="loader">
        <div class="loader-spinner"></div>
    </div>

    <div id="trips-container" class="row g-4" style="display:none;"></div>

    <div id="no-trips" class="empty-state" style="display:none;">
        <i class="fas fa-suitcase-rolling"></i>
        <h5>No Trips Yet</h5>
        <p>You haven't planned any trips yet. Start exploring now!</p>
        <a href="/search" class="btn btn-primary-custom mt-3"><i class="fas fa-search"></i> Plan Your First Trip</a>
    </div>
</div>

<footer class="footer">
    <div class="container text-center">
        <p class="footer-text">&copy; 2026 TravelPlanner. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>
    checkAuth().then(() => loadDashboard());
</script>
</body>
</html>
