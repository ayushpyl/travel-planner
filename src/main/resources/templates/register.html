<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join TravelPlanner and start planning your trips</p>
        <div id="register-alert"></div>
        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="mb-3">
                <label class="form-label-custom">Full Name</label>
                <input type="text" id="regName" class="form-control form-control-dark" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label-custom">Email Address</label>
                <input type="email" id="regEmail" class="form-control form-control-dark" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label-custom">Password</label>
                <input type="password" id="regPassword" class="form-control form-control-dark" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="mb-4">
                <label class="form-label-custom">Confirm Password</label>
                <input type="password" id="regConfirm" class="form-control form-control-dark" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100" id="regBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        <p class="auth-divider">Already have an account?</p>
        <a href="/login" class="btn btn-outline-custom w-100">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
