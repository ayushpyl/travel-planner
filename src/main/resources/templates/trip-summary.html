<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Summary — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i>Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="fas fa-search"></i>Plan Trip</a></li>
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li class="nav-item">
                    <div class="d-flex align-items-center gap-2 ms-2">
                        <span class="nav-link" id="nav-username" style="color: var(--accent-cyan) !important;"></span>
                        <button class="btn btn-outline-custom btn-sm-custom" onclick="logout()">Logout</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="position: relative; z-index: 1;">
    <div class="page-header">
        <a href="/dashboard" class="btn btn-outline-custom btn-sm-custom mb-3"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <h1 class="page-title"><i class="fas fa-file-invoice-dollar text-accent-green"></i> Trip Summary</h1>
        <p class="page-subtitle" id="trip-title"></p>
    </div>

    <div id="trip-loader" class="loader"><div class="loader-spinner"></div></div>

    <div id="trip-details" style="display: none;">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="glass-card mb-4">
                    <h5 style="font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 1.25rem;">
                        <i class="fas fa-info-circle text-accent-blue"></i> Trip Details
                    </h5>
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex justify-content-between"><span style="color: var(--text-muted);">Route</span><span id="detail-route" style="font-weight: 600;"></span></div>
                        <div class="d-flex justify-content-between"><span style="color: var(--text-muted);">Travel Date</span><span id="detail-date"></span></div>
                        <div class="d-flex justify-content-between"><span style="color: var(--text-muted);">Duration</span><span id="detail-days"></span></div>
                        <div class="d-flex justify-content-between"><span style="color: var(--text-muted);">Travelers</span><span id="detail-travelers"></span></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="cost-breakdown">
                    <div class="cost-item"><div class="label"><i class="fas fa-plane"></i> Transportation</div><div class="amount" id="s-cost-transport">₹0</div></div>
                    <div class="cost-item"><div class="label"><i class="fas fa-hotel"></i> Accommodation</div><div class="amount" id="s-cost-hotel">₹0</div></div>
                    <div class="cost-item"><div class="label"><i class="fas fa-utensils"></i> Food</div><div class="amount" id="s-cost-food">₹0</div></div>
                    <div class="cost-item"><div class="label"><i class="fas fa-taxi"></i> Local Transport</div><div class="amount" id="s-cost-local">₹0</div></div>
                    <div class="cost-item"><div class="label"><i class="fas fa-ticket-alt"></i> Attractions</div><div class="amount" id="s-cost-attractions">₹0</div></div>
                    <div class="cost-item cost-total"><div class="label"><i class="fas fa-wallet"></i> Total Budget</div><div class="amount" id="s-cost-total">₹0</div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer"><div class="container text-center"><p class="footer-text">&copy; 2026 TravelPlanner.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>
    checkAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const tripId = urlParams.get('id');
    if (tripId) { loadTripSummary(tripId); }
</script>
</body>
</html>
