<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to access your saved trips and plans</p>
        <div id="login-alert"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="mb-3">
                <label class="form-label-custom">Email Address</label>
                <input type="email" id="loginEmail" class="form-control form-control-dark" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label-custom">Password</label>
                <input type="password" id="loginPassword" class="form-control form-control-dark" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        <p class="auth-divider">Don't have an account?</p>
        <a href="/register" class="btn btn-outline-custom w-100">
            <i class="fas fa-user-plus"></i> Create Account
        </a>
        <div class="mt-3 text-center">
            <small style="color: var(--text-muted);">Demo: demo@travel.com / password123</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
