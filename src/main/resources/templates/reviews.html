<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews — TravelPlanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-globe-americas"></i>TravelPlanner</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--border-glass);">
            <i class="fas fa-bars" style="color: var(--text-primary);"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i>Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/search"><i class="fas fa-search"></i>Plan Trip</a></li>
                <li class="nav-item"><a class="nav-link active" href="/reviews"><i class="fas fa-star"></i>Reviews</a></li>
                <li class="nav-item" id="nav-dashboard" style="display:none;"><a class="nav-link" href="/dashboard"><i class="fas fa-th-large"></i>Dashboard</a></li>
                <li class="nav-item" id="nav-login"><a class="btn btn-outline-custom btn-sm-custom ms-2" href="/login">Sign In</a></li>
                <li class="nav-item" id="nav-user" style="display:none;">
                    <div class="d-flex align-items-center gap-2 ms-2">
                        <span class="nav-link" id="nav-username" style="color: var(--accent-cyan) !important;"></span>
                        <button class="btn btn-outline-custom btn-sm-custom" onclick="logout()">Logout</button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="position: relative; z-index: 1;">
    <div class="page-header">
        <h1 class="page-title"><i class="fas fa-star text-accent-orange"></i> Reviews & Ratings</h1>
        <p class="page-subtitle">Read and share your travel experiences</p>
    </div>

    <div class="row g-4">
        <!-- Review Form -->
        <div class="col-lg-4">
            <div class="glass-card" style="position: sticky; top: 100px;">
                <h5 style="font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 1.25rem;">
                    <i class="fas fa-pen text-accent-cyan"></i> Write a Review
                </h5>
                <div id="review-form-alert"></div>
                <form id="reviewForm" onsubmit="return handleReview(event)">
                    <div class="mb-3">
                        <label class="form-label-custom">Category</label>
                        <select id="reviewEntityType" class="form-select form-select-dark" required>
                            <option value="">Select category</option>
                            <option value="TRANSPORT">Transport</option>
                            <option value="HOTEL">Hotel</option>
                            <option value="ATTRACTION">Attraction</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">Name</label>
                        <input type="text" id="reviewEntityName" class="form-control form-control-dark" placeholder="e.g., IndiGo Airlines, Taj Hotel..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">Entity ID</label>
                        <input type="number" id="reviewEntityId" class="form-control form-control-dark" placeholder="ID number" required min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">Rating</label>
                        <select id="reviewRating" class="form-select form-select-dark" required>
                            <option value="">Select rating</option>
                            <option value="5">★★★★★ Excellent</option>
                            <option value="4">★★★★☆ Very Good</option>
                            <option value="3">★★★☆☆ Good</option>
                            <option value="2">★★☆☆☆ Fair</option>
                            <option value="1">★☆☆☆☆ Poor</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label-custom">Your Review</label>
                        <textarea id="reviewComment" class="form-control form-control-dark" rows="4" placeholder="Share your experience..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="fas fa-paper-plane"></i> Submit Review
                    </button>
                </form>
            </div>
        </div>

        <!-- Reviews List -->
        <div class="col-lg-8">
            <div class="custom-tabs mb-4">
                <button class="custom-tab active" onclick="filterReviews('', this)">All</button>
                <button class="custom-tab" onclick="filterReviews('TRANSPORT', this)">Transport</button>
                <button class="custom-tab" onclick="filterReviews('HOTEL', this)">Hotels</button>
                <button class="custom-tab" onclick="filterReviews('ATTRACTION', this)">Attractions</button>
            </div>
            <div id="reviews-loader" class="loader"><div class="loader-spinner"></div></div>
            <div id="reviews-list"></div>
            <div id="no-reviews" class="empty-state" style="display:none;">
                <i class="fas fa-comment-slash"></i>
                <h5>No Reviews Yet</h5>
                <p>Be the first to share your experience!</p>
            </div>
        </div>
    </div>
</div>

<footer class="footer"><div class="container text-center"><p class="footer-text">&copy; 2026 TravelPlanner.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script>
    checkAuth();
    loadReviews();
</script>
</body>
</html>
